# Builds the signed release APKs (with and without the listener) and publishes them as a GitHub release.
#
# Release: set `version:` in pubspec.yaml (e.g. 1.0.1+2), commit, then
#   git tag v1.0.1 && git push origin v1.0.1
# The tag must match the pubspec version. Can also be started by hand in the Actions tab
# (it then uses the pubspec version and creates the tag itself).
# The release text comes from scripts/release-notes.sh: the commit subjects since the last
# tag, sorted by their type prefix (Feature:, Bugfix:, ...).
#
# Needs these repository secrets (Settings › Secrets and variables › Actions), see
# docs/03-dev-setup.md "Releases":
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password (store and key use the same one)
#   ANDROID_KEY_ALIAS          the key alias (kept)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all commits and tags, for the release notes

      - name: Read version from pubspec.yaml
        id: version
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          name=${full%%+*}
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$name" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec version $full (expected v$name)."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Same Flutter version as the dev container (.devcontainer/Dockerfile).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Write release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Without the key the APK would be signed with a throwaway debug key and couldn't
          # update the installed app, so stop here instead.
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Release signing secrets are missing (see docs/03-dev-setup.md, Releases)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/kept-release.jks
          {
            echo "storeFile=kept-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      # Two APKs per release: kept-<version>.apk (no notification listener) and
      # kept-<version>-listener.apk (--dart-define=KEPT_INCOMING=true), docs/03-dev-setup.md.
      # The in-app updater picks the one that matches its own build.
      - name: Build the APK without the listener
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "kept-${{ steps.version.outputs.name }}.apk"

      - name: Build the APK with the listener
        run: |
          flutter build apk --release --dart-define=KEPT_INCOMING=true
          cp build/app/outputs/flutter-apk/app-release.apk "kept-${{ steps.version.outputs.name }}-listener.apk"

      - name: Check both APKs are signed with the release key
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          for apk in "kept-${{ steps.version.outputs.name }}.apk" "kept-${{ steps.version.outputs.name }}-listener.apk"; do
            "$apksigner" verify --print-certs "$apk" | tee certs.txt
            if grep -q "CN=Android Debug" certs.txt; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
          done

      # Sorted by the commit subjects' type prefixes (Feature:, Bugfix:, ...).
      - name: Write release notes
        run: bash scripts/release-notes.sh "${{ steps.version.outputs.tag }}" | tee release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Kept ${{ steps.version.outputs.name }}
          files: |
            kept-${{ steps.version.outputs.name }}.apk
            kept-${{ steps.version.outputs.name }}-listener.apk
          body_path: release-notes.md

      - name: Remove the key from the runner
        if: always()
        run: rm -f android/kept-release.jks android/key.properties
