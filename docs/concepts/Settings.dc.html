<html lang="en">
<head>
<meta charset="utf-8">

<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{width:390px;height:844px;box-sizing:border-box;background:#F3F5F1;color:#1C2A26;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;font-size:16px;line-height:1.35}
.c{flex:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.card{background:#fff;border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.chip{height:44px;min-width:44px;border-radius:22px;border:1px solid #C5D1CA;background:#fff;color:#1C2A26;font:600 15px 'Nunito',sans-serif;padding:0 12px}
.on{background:#1F6F5C;border-color:#1F6F5C;color:#fff}
.m{color:#55635E;font-size:14px}
.l{font-size:13px;font-weight:700;color:#55635E;letter-spacing:.04em;text-transform:uppercase}
.r{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-weight:700}
.r input[type=checkbox]{width:24px;height:24px;accent-color:#1F6F5C;margin:0;flex:none}
.r input[type=time]{height:44px;border:1px solid #C5D1CA;border-radius:12px;background:#F8FAF7;font:700 16px 'Nunito',sans-serif;color:#1C2A26;padding:0 10px}
h1{margin:0;font-size:26px;font-weight:800}
p{margin:0}
.nav{display:flex;background:#fff;border-top:1px solid #DDE5E0}
.nav a{flex:1;height:64px;box-sizing:border-box;border-top:3px solid transparent;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#55635E;text-decoration:none}
.nav a.cur{color:#1F6F5C;border-top-color:#1F6F5C}
</style>
</helmet>
<div class="s">
<div class="c">
<h1>Settings</h1>
<div class="card">
<p class="l">Evening question</p>
<label class="r">Ask me at<input type="time" value="19:30"></label>
<p style="font-weight: 700">Days I can be asked</p>
<div style="display: flex; gap: 4px">
<button class="chip on" aria-pressed="true">Mo</button>
<button class="chip" aria-pressed="false">Tu</button>
<button class="chip on" aria-pressed="true">We</button>
<button class="chip on" aria-pressed="true">Th</button>
<button class="chip" aria-pressed="false">Fr</button>
<button class="chip on" aria-pressed="true">Sa</button>
<button class="chip on" aria-pressed="true">Su</button>
</div>
</div>
<div class="card">
<p class="l">Home screen</p>
<div class="r">Show open items as
<div style="display: flex; gap: 6px">
<button class="chip on" aria-pressed="true">One</button>
<button class="chip" aria-pressed="false">Three</button>
</div>
</div>
</div>
<div class="card">
<p class="l">Optional parts</p>
<label class="r">Progress and treats<input type="checkbox" checked></label>
<label class="r">Birthday follow-up<input type="checkbox" checked></label>
<label class="r">Notice when I owe a reply<input type="checkbox" checked></label>
<p class="m">Reads who wrote to you from message notifications. Stays on this phone. Needs notification access.</p>
</div>
<div class="card">
<p class="l">More</p>
<div class="r">Language
<div style="display: flex; gap: 6px">
<button class="chip" aria-pressed="false">Deutsch</button>
<button class="chip on" aria-pressed="true">English</button>
</div>
</div>
<button class="chip" style="align-self: flex-start">Friend classes and rhythms</button>
</div>
</div>

<a href="People.dc.html">People</a>

</nav>
</div>
