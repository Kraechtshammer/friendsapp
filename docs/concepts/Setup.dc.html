<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>First start</title>

</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
.s{width:390px;height:844px;box-sizing:border-box;background:#F3F5F1;color:#1C2A26;font-family:'Nunito',system-ui,sans-serif;display:flex;flex-direction:column;font-size:16px;line-height:1.35}
.c{flex:1;padding:28px 20px 16px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.b{height:48px;border:0;border-radius:14px;font:700 16px 'Nunito',sans-serif;padding:0 18px;background:#1F6F5C;color:#fff}
.m{color:#55635E}
.in{box-sizing:border-box;width:100%;height:48px;border:1px solid #C5D1CA;border-radius:14px;padding:0 14px;font:400 16px 'Nunito',sans-serif;color:#1C2A26;background:#fff}
.row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:8px 12px;min-height:44px}
.row input{width:24px;height:24px;accent-color:#1F6F5C;flex:none;margin:0}
.row label{flex:1;font-weight:700}
.row select{height:44px;border:1px solid #C5D1CA;border-radius:12px;background:#F8FAF7;font:600 14px 'Nunito',sans-serif;color:#1C2A26;padding:0 8px;max-width:150px}
h1{margin:0;font-size:26px;font-weight:800}
p{margin:0}
</style>
</helmet>
<div class="s">
<div class="c">
<h1>Pick a few people to start</h1>
<p class="m">Five is plenty. You can add more any time. Numbers and birthdays come from your contacts.</p>
<label for="q" style="position: absolute; left: -9999px">Search contacts</label>
<input id="q" class="in" type="search" placeholder="Search contacts">
<div class="row"><input id="p1" type="checkbox" checked><label for="p1">Tom Berger</label><select aria-label="How close, Tom Berger"><option>Close friend</option><option>Now and then</option><option>A few times a year</option><option>Family</option></select></div>
<div class="row"><input id="p2" type="checkbox" checked><label for="p2">Anna Keller</label><select aria-label="How close, Anna Keller"><option>Close friend</option><option>Now and then</option><option>A few times a year</option><option>Family</option></select></div>
<div class="row"><input id="p3" type="checkbox" checked><label for="p3">Jonas Wirth</label><select aria-label="How close, Jonas Wirth"><option>Getting back in touch</option><option>Close friend</option><option>Now and then</option><option>A few times a year</option></select></div>
<div class="row"><input id="p4" type="checkbox" checked><label for="p4">Aunt Maria</label><select aria-label="How close, Aunt Maria"><option>Family</option><option>Close friend</option><option>Now and then</option><option>A few times a year</option></select></div>
<div class="row"><input id="p5" type="checkbox"><label for="p5">Sophie Brandt</label></div>
<div class="row"><input id="p6" type="checkbox"><label for="p6">Marek Nowak</label></div>
<div class="row"><input id="p7" type="checkbox"><label for="p7">Grandpa</label></div>
<div style="flex: 1"></div>
<button class="b">Start with 4 people</button>
</div>
</div>
</x-dc>
